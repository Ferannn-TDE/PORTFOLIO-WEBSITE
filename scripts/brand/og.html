<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<style>
@font-face { font-family: "Instrument Serif"; src: url("../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Instrument Serif"; font-style: italic; src: url("../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 100 900; src: url("../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 100 800; src: url("../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); }
html, body { margin: 0; }
body {
  width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
  background-color: #1c1838; color: #f4efe6;
  background-image: radial-gradient(rgb(244 239 230 / 0.12) 1.2px, transparent 1.2px); background-size: 24px 24px;
  padding: 64px 72px; display: grid; grid-template-columns: 1fr 360px; gap: 56px; align-items: center;
  font-family: "Inter", sans-serif;
}
.label { font: 400 15px/1 "JetBrains Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase; color: rgb(244 239 230 / 0.7); }
h1 { margin: 26px 0 0; font: 400 136px/0.96 "Instrument Serif", serif; letter-spacing: -0.02em; }
p { margin: 30px 0 0; font-size: 27px; font-weight: 300; line-height: 1.4; max-width: 24ch; }
.foot { position: absolute; left: 72px; right: 72px; bottom: 44px; display: flex; justify-content: space-between; align-items: baseline; }
.mark { font: italic 400 40px/1 "Instrument Serif", serif; }
.grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; padding: 20px; border: 1px solid rgb(244 239 230 / 0.16); background: rgb(0 0 0 / 0.3); }
.c { aspect-ratio: 1; background: rgb(244 239 230 / 0.14); }
.v { background: rgb(169 156 245 / 0.45); }
.p { background: #f4efe6; }
.w { background: transparent; box-shadow: inset 0 0 0 1px rgb(244 239 230 / 0.16); }
.t { background: #f4efe6; box-shadow: 0 0 0 2px #f4efe6; }
</style>
</head>
<body>
<div>
  <div class="label">( Now shipping )</div>
  <h1>Feran<br>Odedairo</h1>
  <p>Software engineer building full‑stack products that hold up.</p>
</div>
<div class="grid" id="grid"></div>
<div class="foot"><span class="label">Edwardsville, IL</span><span class="mark">fo.</span></div>
<script>
// A static route drawn on an 8 × 6 grid: start, visited cells, a wall, the path.
const C = 8, R = 6;
const walls = new Set([11, 19, 27, 35]);
const path = new Set([25, 26, 34, 42, 43, 44, 36, 28, 20, 21, 22]);
const visited = new Set([16, 17, 18, 24, 32, 33, 40, 41, 48, 49, 50, 51, 52, 45, 37, 29, 12, 13, 14, 30, 38, 46, 23]);
const g = document.getElementById("grid");
for (let i = 0; i < C * R; i++) {
  const el = document.createElement("span");
  el.className = "c" + (walls.has(i) ? " w" : i === 22 ? " t" : path.has(i) ? " p" : visited.has(i) ? " v" : "");
  g.appendChild(el);
}
</script>
</body>
</html>
